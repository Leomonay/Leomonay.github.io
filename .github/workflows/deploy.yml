# Builds the static export and publishes it to GitHub Pages.
# Requires Settings → Pages → Source: "GitHub Actions" (see README → Publicación).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels a queued one but never an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Same checks as the pre-commit hook, plus the ones that need the whole project.
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:messages
      - run: npm run check:contrast

      # public/.nojekyll ends up in out/: without it, GitHub Pages runs Jekyll, which
      # ignores folders starting with "_" (like _next/) and the site loads without JS/CSS.
      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
